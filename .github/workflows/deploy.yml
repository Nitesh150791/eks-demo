name: Deploy to EKS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:

    # ✅ 1. Checkout code
    - name: Checkout
      uses: actions/checkout@v3

    # ✅ 2. Configure AWS
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        region: ap-south-1

    # ✅ 3. Login to ECR
    - name: Login to Amazon ECR
      run: |
        aws ecr get-login-password --region ap-south-1 \
        | docker login --username AWS --password-stdin ${{
 secrets.ECR_REPOSITORY }}

    # ✅ 4. Build Docker Image
    - name: Build Docker Image
      run: docker build -t my-app .

    # ✅ 5. Tag Image
    - name: Tag Image
      run: docker tag my-app:latest ${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}

    # ✅ 6. Push to ECR
    - name: Push Image
      run: docker push ${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}

    # ✅ 7. Update kubeconfig
    - name: Update kubeconfig
      run: aws eks update-kubeconfig \
        --region ap-south-1 \
        --name ${{ secrets.EKS_CLUSTER_NAME }}

    # ✅ 8. Replace image in deployment.yaml
    - name: Update K8s manifest
      run: |
        sed -i "s|IMAGE_PLACEHOLDER|${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}|g" K8s/deployment.yaml

    # ✅ 9. Deploy to EKS
    - name: Deploy to EKS
      run: |
        kubectl apply -f K8s/deployment.yaml
        kubectl apply -f K8s/service.yaml
